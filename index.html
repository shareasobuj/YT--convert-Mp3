<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 30px 24px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #e6f7f2;
      color: #0d9488;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #1e293b;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .input-label {
      display: block;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
      color: #475569;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 40px 14px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      cursor: pointer;
      display: none;
      font-size: 16px;
    }

    .btn-convert {
      width: 100%;
      background: #cc0000;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-convert:hover {
      background: #b30000;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 25px 0;
    }

    .status-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }

    .status-title i {
      color: #10b981;
    }

    .preview-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      margin-bottom: 20px;
    }

    .preview-card img {
      width: 90px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      background: #cbd5e1;
    }

    .preview-info {
      flex: 1;
      overflow: hidden;
    }

    .preview-info h4 {
      font-size: 13px;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .preview-info p {
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-download-main {
      width: 100%;
      background: #059669;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
      transition: background 0.2s;
    }

    .btn-download-main:hover {
      background: #047857;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .mirror-btn {
      width: 100%;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .mirror-btn:hover {
      background: #e2e8f0;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge"><i class="fa-solid fa-music"></i> High Quality Audio</div>
    
    <h1>YouTube to MP3 Converter</h1>
    
    <label class="input-label" for="ytUrl">Paste YouTube Link</label>
    <div class="input-wrapper">
      <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." oninput="checkInput()">
      <i class="fa-solid fa-xmark clear-btn" id="clearBtn" onclick="clearInput()"></i>
    </div>
    
    <button class="btn-convert" onclick="processConversion()">
      <i class="fa-solid fa-play"></i> Convert to MP3
    </button>

    <div class="divider"></div>

    <div class="status-title">
      <i class="fa-solid fa-circle-check"></i> Your MP3 is ready!
    </div>

    <div class="preview-card">
      <img id="thumbImg" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop&q=60" alt="Thumbnail">
      <div class="preview-info">
        <h4 id="videoTitle">Ready to convert video...</h4>
        <p><i class="fa-solid fa-music"></i> Quality: 320 kbps High Quality</p>
      </div>
    </div>

    <a href="javascript:void(0)" id="mainDownloadBtn" class="btn-download-main" onclick="startDownload()">
      <i class="fa-solid fa-download"></i> Download MP3
    </a>

    <div class="section-label">Backup Server Mirrors</div>
    
    <a href="javascript:void(0)" class="mirror-btn" onclick="useMirror(1)">
      <i class="fa-solid fa-server"></i> Server 1 (Direct Mirror)
    </a>
    <a href="javascript:void(0)" class="mirror-btn" onclick="useMirror(2)">
      <i class="fa-solid fa-bolt"></i> Server 2 (Fast Mirror)
    </a>

    <footer>
      &copy; 2026 YouTube to MP3 Converter. All rights reserved.
    </footer>
  </div>

  <script>
    function extractVideoID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function checkInput() {
      const input = document.getElementById('ytUrl').value;
      document.getElementById('clearBtn').style.display = input ? 'block' : 'none';
    }

    function clearInput() {
      document.getElementById('ytUrl').value = '';
      checkInput();
    }

    function processConversion() {
      const url = document.getElementById('ytUrl').value.trim();
      const videoId = extractVideoID(url);

      if (!videoId) {
        alert('Please enter a valid YouTube video URL!');
        return;
      }

      document.getElementById('thumbImg').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      document.getElementById('videoTitle').innerText = `YouTube Video ID: ${videoId}`;

      // Directly trigger working download tab
      window.open(`https://y2mate.nu/${videoId}`, '_blank');
    }

    function startDownload() {
      const url = document.getElementById('ytUrl').value.trim();
      const videoId = extractVideoID(url);

      if (!videoId) {
        alert('Please paste a YouTube link first!');
        return;
      }

      window.open(`https://y2mate.is/en/download?url=https://www.youtube.com/watch?v=${videoId}`, '_blank');
    }

    function useMirror(serverNum) {
      const url = document.getElementById('ytUrl').value.trim();
      const videoId = extractVideoID(url);

      if (!videoId) {
        alert('Please enter a valid YouTube video URL first!');
        return;
      }

      if (serverNum === 1) {
        window.open(`https://yt1s.ltd/en/?q=https://www.youtube.com/watch?v=${videoId}`, '_blank');
      } else if (serverNum === 2) {
        window.open(`https://ezmp3.cc/api/convert?url=https://www.youtube.com/watch?v=${videoId}`, '_blank');
      }
    }
  </script>
</body>
</html>
